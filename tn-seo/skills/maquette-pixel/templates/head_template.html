<!DOCTYPE html>
<html lang="[LANG]">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="canonical" href="[CANONICAL_URL]">

<meta property="og:type" content="website">
<meta property="og:title" content="[OG_TITLE]">
<meta property="og:description" content="[OG_DESC]">
<meta property="og:image" content="[OG_IMAGE_URL]">

<!-- Inject client inline styles + CSS bundle here -->
[CLIENT_INLINE_STYLES]
[CLIENT_CSS_LINKS]

<!-- JSON-LD : Service / Product / Organization -->
<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"[SCHEMA_TYPE]",
  "name":"[SCHEMA_NAME]",
  "description":"[SCHEMA_DESC]",
  "url":"[CANONICAL_URL]",
  "image":"[OG_IMAGE_URL]"
}
</script>

<!-- Suisseo overlay -->
<style>
.suisseo-banner{position:fixed;right:16px;bottom:16px;z-index:9999;background:#1E2A38;color:#fff;font-size:11px;padding:9px 14px;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.18);font-family:system-ui,sans-serif;line-height:1.4}
.suisseo-banner b{color:#95C11F}
.suisseo-banner a{color:rgba(255,255,255,.65);text-decoration:none}
.suisseo-banner a:hover{color:#fff}
</style>
</head>

  Maquette <b>Suisseo</b> &middot; Page [PAGE_LABEL]<br>
  <a href="mailto:thomas.nedjar@suisseo.ch">thomas.nedjar@suisseo.ch</a>

</html>
